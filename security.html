 <header class="top">

  <div class="content">
    <h1>Security Settings</h1>
    <form id="securityForm">
      <label for="password">Change Password:</label>
      <input type="password" id="password" placeholder="New password">

      <label for="twofactor">Enable Two-Factor Authentication:</label>
      <select id="twofactor">
        <option value="off">Off</option>
        <option value="sms">SMS</option>
        <option value="authenticator">Authenticator App</option>
      </select>

      <button type="button" onclick="saveSecurity()">Save Security Settings</button>
    </form>
    <div id="securityOutput"></div>
  </div>

  <script>
    function saveSecurity() {
      const password = document.getElementById('password').value;
      const twofactor = document.getElementById('twofactor').value;
      document.getElementById('securityOutput').innerHTML = `<p>Password changed</p><p>Two-Factor: ${twofactor}</p>`;
      alert('Security settings updated!');
    }
  </script>
</body>
